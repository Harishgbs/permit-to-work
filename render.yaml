services:
  - type: web
    name: permit-to-work-api
    runtime: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm ci --include=dev && npm run prisma:generate --workspace server && npm run build --workspace server
    startCommand: npm run prisma:migrate:deploy --workspace server && npm run start --workspace server
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: EXPIRY_SCAN_INTERVAL_MS
        value: 60000
